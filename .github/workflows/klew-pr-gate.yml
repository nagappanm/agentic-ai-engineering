name: klew PR gate

# Runs the user-journey suite against the PR's app and takes a traffic-light
# action: 🟢 approve + auto-merge · 🟠 request review · 🔴 file a bug.
# Deterministic — no LLM/API key needed (journeys=Playwright, grade=testguard,
# JSON-update=klew dry-run, delta-justification=yilsf mock).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: klew-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Enterprise: set repo variable KLEW_BASE_URL to a per-PR preview/staging
      # URL to test that instead of the built-and-served local app.
      KLEW_BASE_URL: ${{ vars.KLEW_BASE_URL }}
      TRACKER: ${{ vars.KLEW_TRACKER || 'github' }}
      JIRA_PROJECT: ${{ vars.KLEW_JIRA_PROJECT }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # testguard uses fs.globSync (Node 22+)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          (cd e2e && npm ci || npm install)
          (cd testguard && npm ci || npm install)
          (cd e2e && npx playwright install --with-deps chromium)

      # Rolling run-history for flakedoctor + the append-only evidence-pack chain:
      # restore the most recent window (via the restore-keys prefix), append this
      # run below, and save a fresh entry at post-job.
      - name: Restore run-history + evidence chain
        uses: actions/cache@v4
        with:
          path: |
            .ci/history
            .evidence
          key: klew-run-history-${{ github.run_id }}
          restore-keys: |
            klew-run-history-

      - name: Resolve requirements (Jira ticket → else fallback file)
        run: |
          python pr_gate/requirements_source.py \
            --branch "${{ github.head_ref }}" \
            --title "${{ github.event.pull_request.title }}" \
            --fallback e2e/requirements.txt \
            --out /tmp/requirements.txt

      - name: Resolve BASE_URL (preview URL, or flag a local serve)
        run: |
          # A backgrounded server does NOT survive across steps, so we only set
          # env here and (re)start the static app inside each step that needs it.
          if [ -n "$KLEW_BASE_URL" ]; then
            echo "BASE_URL=$KLEW_BASE_URL" >> "$GITHUB_ENV"
            echo "SERVE_LOCAL=0" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=http://127.0.0.1:8123" >> "$GITHUB_ENV"
            echo "SERVE_LOCAL=1" >> "$GITHUB_ENV"
          fi

      - name: Run journey suite
        continue-on-error: true
        run: |
          if [ "$SERVE_LOCAL" = "1" ]; then
            if ! curl -sf "$BASE_URL/" >/dev/null 2>&1; then
              nohup python3 -m http.server 8123 --bind 127.0.0.1 \
                --directory "$GITHUB_WORKSPACE/e2e/app" >/tmp/app.log 2>&1 &
            fi
            for i in $(seq 1 40); do curl -sf "$BASE_URL/" >/dev/null 2>&1 && break; sleep 0.5; done
          fi
          cd e2e
          BASE_URL="$BASE_URL" npx playwright test --reporter=json > "$GITHUB_WORKSPACE/results.json" || true

      - name: Grade with testguard
        continue-on-error: true
        run: |
          if [ "$SERVE_LOCAL" = "1" ]; then
            if ! curl -sf "$BASE_URL/" >/dev/null 2>&1; then
              nohup python3 -m http.server 8123 --bind 127.0.0.1 \
                --directory "$GITHUB_WORKSPACE/e2e/app" >/tmp/app.log 2>&1 &
            fi
            for i in $(seq 1 40); do curl -sf "$BASE_URL/" >/dev/null 2>&1 && break; sleep 0.5; done
          fi
          cd testguard
          npx tsx src/cli.ts "$GITHUB_WORKSPACE/e2e/*.spec.ts" --json \
            --require-traceability --requirements /tmp/requirements.txt \
            --dynamic --base-url "$BASE_URL" > "$GITHUB_WORKSPACE/testguard.json" || true

      - name: Cross-run flakiness + requirement drift (gate signals)
        continue-on-error: true
        run: |
          APP=$(python -c "import json;print(json.load(open('pr_gate/pr-gate.config.json')).get('app_cache',''))")
          # 1) record this run in the rolling window, then classify across it
          python pr_gate/run_history.py --dir .ci/history --add results.json \
            --sha "$GITHUB_SHA" --keep 10 || true
          python pr_gate/flakedoctor.py --runs-dir .ci/history --glob 'run-*.json' --json \
            > flake.json || echo '{}' > flake.json
          # 2) requirement-text drift vs the committed baseline
          if [ -f pr_gate/reqdrift.json ]; then
            python pr_gate/reqdrift.py --requirements /tmp/requirements.txt \
              --tests 'e2e/*.spec.ts' --baseline pr_gate/reqdrift.json --json \
              > drift.json || echo '{}' > drift.json
          else
            echo '{}' > drift.json
          fi
          # 3) accessibility audit (optional; feeds the board)
          if [ -n "$APP" ]; then
            python .claude/skills/klew/scripts/a11y_report.py --app "$APP" --format json \
              > a11y.json || echo '{}' > a11y.json
          else
            echo '{}' > a11y.json
          fi
          # 4) intent coverage: do the tests actually assert their requirements?
          python pr_gate/intent_coverage.py --requirements /tmp/requirements.txt \
            --tests 'e2e/*.spec.ts' --json > intent.json || echo '{}' > intent.json

      - name: Cache-update? (does this PR change the selector cache?) + justify
        id: cache
        run: |
          BASE=origin/${{ github.base_ref }}
          git diff "$BASE"...HEAD > /tmp/pr.diff || git diff HEAD~1 > /tmp/pr.diff
          if git diff --name-only "$BASE"...HEAD | grep -q 'selectors.json'; then
            echo "status=CACHE UPDATE NEEDED" >> "$GITHUB_OUTPUT"
            if python pr_gate/justify.py --diff /tmp/pr.diff --requirements /tmp/requirements.txt; then
              echo "justified=true" >> "$GITHUB_OUTPUT"
            else
              echo "justified=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "status=CACHE UP TO DATE" >> "$GITHUB_OUTPUT"
            echo "justified=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assertion-erosion scan (did this PR weaken its tests?)
        continue-on-error: true
        run: |
          # Reuse the PR diff computed above; flags disabled/trivialised/softened
          # tests as an orange review signal. Never red — a heuristic a human checks.
          python pr_gate/assertion_guard.py --diff /tmp/pr.diff --json \
            > assertion.json || echo '{}' > assertion.json

      - name: Knowledge note fresh? (docs drift vs the selector cache)
        id: knowledge
        continue-on-error: true
        run: |
          APP=$(python -c "import json;print(json.load(open('pr_gate/pr-gate.config.json')).get('app_cache',''))")
          if [ -n "$APP" ]; then
            STATUS=$(python .claude/skills/klew/scripts/knowledge_check.py --app "$APP" | head -1)
          else
            STATUS="KNOWLEDGE UP TO DATE"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Decide traffic light
        id: gate
        run: |
          set +e
          python pr_gate/gate.py \
            --journeys results.json --testguard testguard.json \
            --cache-status "${{ steps.cache.outputs.status }}" \
            --justified "${{ steps.cache.outputs.justified }}" \
            --knowledge-status "${{ steps.knowledge.outputs.status }}" \
            --flakedoctor flake.json --reqdrift drift.json --intent-coverage intent.json \
            --assertion-guard assertion.json \
            --emit-bugs /tmp/bugs --pr "$PR" --base-url "$BASE_URL" \
            --json > verdict.json
          code=$?
          light=$(python -c "import json;print(json.load(open('verdict.json'))['light'])")
          echo "light=$light" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat verdict.json

      # Seal a tamper-evident proof pack: bind the verdict to the exact inputs
      # that produced it, chained to prior runs. An INDEPENDENT post-verdict step —
      # not the agent that authored the tests — so the green light is provable,
      # not just asserted. Verify later with `qe_evidence.py verify`.
      - name: Seal evidence pack
        if: always()
        continue-on-error: true
        run: |
          python pr_gate/qe_evidence.py seal --out .evidence \
            --pr "$PR" --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --run-id "${{ github.run_id }}" \
            --verdict verdict.json \
            --input journeys=results.json --input testguard=testguard.json \
            --input flake=flake.json --input drift=drift.json \
            --input a11y=a11y.json --input intent=intent.json \
            --input assertion=assertion.json \
            --prev-chain --quiet > /tmp/pack_path.txt || true
          echo "PACK=$(cat /tmp/pack_path.txt)" >> "$GITHUB_ENV"

      - name: Generate QE board (one console — verdict + next moves)
        if: always()
        continue-on-error: true
        run: |
          APP=$(python -c "import json;print(json.load(open('pr_gate/pr-gate.config.json')).get('app_cache','app'))")
          python pr_gate/qe_board.py --app "${APP:-app}" \
            --requirements /tmp/requirements.txt \
            --flakedoctor flake.json --reqdrift drift.json --a11y a11y.json \
            --intent-coverage intent.json \
            --branch "${{ github.head_ref || github.ref_name }}" --window "last 10 runs" \
            --out qe-board.html || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klew-pr-gate
          path: |
            results.json
            testguard.json
            verdict.json
            flake.json
            drift.json
            a11y.json
            intent.json
            assertion.json
            qe-board.html
            .evidence/**
            e2e/test-results/**

      - name: 🔴 RED — file bug(s) + fail
        if: steps.gate.outputs.light == 'red'
        run: |
          STORY=$(python pr_gate/requirements_source.py --branch "${{ github.head_ref }}" \
            --title "${{ github.event.pull_request.title }}" --out /dev/null 2>&1 | grep -oE 'key=[A-Z]+-[0-9]+' | cut -d= -f2 || true)
          for f in /tmp/bugs/*.json; do
            [ -e "$f" ] || continue
            python pr_gate/tracker.py --bug "$f" --tracker "$TRACKER" \
              --project "$JIRA_PROJECT" --repo "${{ github.repository }}" \
              ${STORY:+--story-key "$STORY"} || true
          done
          [ -n "$PACK" ] && python pr_gate/qe_evidence.py sign --pack "$PACK" \
            --by "klew-pr-gate[bot]" --decision reject \
            --note "automated gate: journey/grade failure — bug(s) filed" || true
          gh pr comment "$PR" --body "🔴 klew PR gate: journey failure(s) — bug(s) filed. See the \`klew-pr-gate\` artifact for repro (sealed evidence pack included)." || true
          exit 1

      - name: 🟠 ORANGE — request review
        if: steps.gate.outputs.light == 'orange'
        run: |
          gh pr edit "$PR" --add-label "needs-review" || true
          REASONS=$(python -c "import json;print(chr(10).join('- '+r for r in json.load(open('verdict.json'))['reasons']))")
          gh pr comment "$PR" --body "$(printf '🟠 klew PR gate: needs human review.\n%s' "$REASONS")" || true

      - name: 🟢 GREEN — approve + auto-merge
        if: steps.gate.outputs.light == 'green'
        run: |
          [ -n "$PACK" ] && python pr_gate/qe_evidence.py sign --pack "$PACK" \
            --by "klew-pr-gate[bot]" --decision approve \
            --note "automated gate: all journeys pass, testguard clean" || true
          gh pr review "$PR" --approve --body "🟢 klew PR gate: all journeys pass, testguard clean. Verdict sealed in the evidence pack (\`qe_evidence.py verify\`). A human merge countersigns this." || true
          gh pr merge "$PR" --auto --squash || true
